// ============================================================
// INPUT
// ============================================================
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playNote(freq, startTime, dur, type = 'square', vol = 0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
  osc.start(startTime);
  osc.stop(startTime + dur);
}

function playSFX(type) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  if (type === 'jump') {
    playNote(300, t, 0.05, 'square', 0.12);
    playNote(500, t + 0.05, 0.08, 'square', 0.08);
  } else if (type === 'coin') {
    playNote(880, t, 0.05, 'sine', 0.12);
    playNote(1320, t + 0.05, 0.1, 'sine', 0.08);
  } else if (type === 'stomp') {
    playNote(180, t, 0.05, 'square', 0.18);
    playNote(100, t + 0.05, 0.1, 'square', 0.12);
  } else if (type === 'gameover') {
    playNote(440, t, 0.2, 'square', 0.12);
    playNote(330, t + 0.22, 0.2, 'square', 0.12);
    playNote(220, t + 0.45, 0.4, 'square', 0.12);
  } else if (type === 'clear') {
    [523, 659, 784, 1047].forEach((f, i) => playNote(f, t + i * 0.1, 0.15, 'sine', 0.12));
  } else if (type === 'block') {
    playNote(440, t, 0.04, 'square', 0.12);
    playNote(550, t + 0.04, 0.07, 'square', 0.08);
  }
}

// BGM - 明るいチップチューン
const BGM_NOTES = [
  [523,0.15],[659,0.15],[784,0.15],[1047,0.3],
  [784,0.15],[659,0.15],[523,0.15],[392,0.3],
  [440,0.15],[523,0.15],[659,0.15],[880,0.3],
  [784,0.15],[659,0.15],[523,0.15],[392,0.3],
  [523,0.15],[659,0.15],[784,0.15],[659,0.15],
  [523,0.15],[440,0.15],[392,0.3],[392,0.15],
  [440,0.15],[523,0.15],[659,0.15],[784,0.15],
  [1047,0.3],[784,0.15],[523,0.3],
];

let bgmPlaying = false;
let bgmTimeoutId = null;

function scheduleBGM() {
  if (!audioCtx || !bgmPlaying) return;
  let t = audioCtx.currentTime + 0.05;
  for (const [freq, dur] of BGM_NOTES) {
    playNote(freq, t, dur * 0.9, 'square', 0.07);
    playNote(freq / 2, t, dur * 0.4, 'triangle', 0.04);
    t += dur;
  }
  const msLeft = (t - audioCtx.currentTime - 0.05) * 1000;
  bgmTimeoutId = setTimeout(scheduleBGM, msLeft);
}

function startBGM() {
  if (bgmPlaying) return;
  bgmPlaying = true;
  scheduleBGM();
}

function stopBGM() {
  bgmPlaying = false;
  if (bgmTimeoutId !== null) {
    clearTimeout(bgmTimeoutId);
    bgmTimeoutId = null;
  }
}

// ============================================================

    {x: 2800, y: GH - 32, type: 'spike',  vx: -0.8, vy: 0, hp: 99,alive: true, dir: -1},

    {x: 3500, y: GH - 32, type: 'shell',  vx: -1.0, vy: 0, hp: 2, alive: true, dir: -1},

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'start';
let score = 0;
let coinCount = 0;
let stage = null;
let player = null;
let camera = {x: 0};
let particles = [];
let floatingCoins = [];
let globalFrame = 0;
let animTimer = 0;

// AI
let aiMode = false;
let aiJumpCooldown = 0;
let aiAutoStartTimer = 0;
// DQN model loaded from rl/model_weights.js (null = use rule-based fallback)
let rlModel = (typeof RL_MODEL_WEIGHTS !== 'undefined') ? RL_MODEL_WEIGHTS : null;
// Frame-skip replication: DQN decides once every 4 frames (matches training)
let rlSkipCount  = 0;
let rlLastAction = 0;

function initGame() {
  stage = makeStage();
  player = {
    x: 80, y: GH - 40,
    w: 36, h: 36,
    vx: 0, vy: 0,
    onGround: false,
    state: 'idle',

    animFrame: 0,
    dead: false,

  score = 0;
  coinCount = 0;
  particles = [];
  floatingCoins = [];

  animTimer = 0;
}

// ============================================================
// COLLISION HELPERS
// ============================================================
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function allSolids() {
  return [...stage.ground, ...stage.platforms];
}

function resolveSolidCollision(obj, ow, oh) {
  obj.onGround = false;
  for (const s of allSolids()) {
    if (!overlap(obj.x, obj.y, ow, oh, s.x, s.y, s.w, s.h)) continue;
    const ol = (obj.x + ow) - s.x;
    const or_ = (s.x + s.w) - obj.x;
    const ot = (obj.y + oh) - s.y;
    const ob = (s.y + s.h) - obj.y;
    const min = Math.min(ol, or_, ot, ob);
    if (min === ot) {
      if (obj.vy >= 0) { obj.y = s.y - oh; obj.vy = 0; obj.onGround = true; }
      // vy < 0: top corner clip while jumping — skip to prevent spurious sideways push
    } else if (min === ob && obj.vy < 0) { obj.y = s.y + s.h; obj.vy = 0; }
    else if (min === ol) { obj.x = s.x - ow; obj.vx = 0; }
    else { obj.x = s.x + s.w; obj.vx = 0; }
  }
}

function resolveBlockCollision(p) {
  for (const b of stage.blocks) {
    if (!overlap(p.x, p.y, p.w, p.h, b.x, b.y, TILE, TILE)) continue;
    const ol = (p.x + p.w) - b.x;
    const or_ = (b.x + TILE) - p.x;
    const ot = (p.y + p.h) - b.y;
    const ob = (b.y + TILE) - p.y;
    const min = Math.min(ol, or_, ot, ob);
    if (min === ot) {
      if (p.vy >= 0) { p.y = b.y - p.h; p.vy = 0; p.onGround = true; }
      // skip top corner clip while jumping
    } else if (min === ob && p.vy < 0) {
      p.y = b.y + TILE; p.vy = 0;
      if (!b.hit) {
        b.hit = true;
        b.bounceTimer = 10;
        playSFX('block');
        if (b.hasCoins) {
          coinCount++;
          score += 100;
          floatingCoins.push({x: b.x + TILE / 2 - 8, y: b.y, vy: -5, alpha: 1});
        }
      }
    }
    else if (min === ol) { p.x = b.x - p.w; p.vx = 0; }
    else { p.x = b.x + TILE; p.vx = 0; }
  }
}

function resolveEnemyBlockCollision(e) {
  for (const b of stage.blocks) {
    if (!overlap(e.x, e.y, 24, 28, b.x, b.y, TILE, TILE)) continue;
    const ol = (e.x + 24) - b.x;
    const or_ = (b.x + TILE) - e.x;
    const ot = (e.y + 28) - b.y;
    const ob = (b.y + TILE) - e.y;
    const min = Math.min(ol, or_, ot, ob);
    if (min === ot && e.vy >= 0) { e.y = b.y - 28; e.vy = 0; e.onGround = true; }
    else if (min === ob && e.vy < 0) { e.y = b.y + TILE; e.vy = 0; }
    else if (min === ol) { e.x = b.x - 24; e.vx *= -1; e.dir *= -1; }
    else { e.x = b.x + TILE; e.vx *= -1; e.dir *= -1; }
  }
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -Math.random() * 5 - 2,
      color, life: 30 + Math.random() * 20,
      size: 3 + Math.random() * 3,
    });
  }
}

// ============================================================
// DRAW HELPERS
// ============================================================
function drawBackground() {
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, W, H);

  // Parallax mountains
  ctx.fillStyle = 'rgba(100,150,100,0.35)';
  for (let i = 0; i < 22; i++) {
    const mx = (i * 400 - camera.x * 0.4) % (stage.width + W);
    ctx.beginPath();
    ctx.moveTo(mx, H - TILE);
    ctx.lineTo(mx + 120, H - TILE - 90);
    ctx.lineTo(mx + 240, H - TILE);
    ctx.closePath();
    ctx.fill();
  }

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const cloudX = [200,500,900,1300,1700,2100,2500,2900,3300,3700,4100,4500,4900,5300,5700,6100,6500,6900,7300,7700];
  const cloudY = [60,40,70,50,65,45,55,70,40,60,50,65,45,55,40,65,50,70,45,60];
  for (let i = 0; i < cloudX.length; i++) {
    const sx = (cloudX[i] - camera.x * 0.3 + stage.width + W) % (stage.width + W);
    const cy = cloudY[i];
    ctx.beginPath();
    ctx.arc(sx, cy, 18, 0, Math.PI * 2);
    ctx.arc(sx + 20, cy - 10, 23, 0, Math.PI * 2);
    ctx.arc(sx + 44, cy, 18, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlatform(p) {
  const sx = p.x - camera.x;
  if (sx + p.w < 0 || sx > W) return;
  ctx.fillStyle = '#228B22';
  ctx.fillRect(sx, p.y, p.w, TILE);
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(sx, p.y + 8, p.w, TILE - 8);
  ctx.fillStyle = '#32CD32';
  for (let dx = 0; dx < p.w; dx += 8) ctx.fillRect(sx + dx, p.y, 6, 5);
}

function drawBlock(b) {
  const sx = b.x - camera.x;
  if (sx + TILE < 0 || sx > W) return;
  const by = b.bounceTimer > 0 ? b.y - 4 : b.y;
  ctx.fillStyle = b.hit ? '#C8A060' : '#D4A030';
  ctx.fillRect(sx, by, TILE, TILE);
  ctx.strokeStyle = '#8B6010';
  ctx.lineWidth = 2;
  ctx.strokeRect(sx + 1, by + 1, TILE - 2, TILE - 2);
  if (!b.hit) {
    ctx.fillStyle = '#F0C040';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('?', sx + TILE / 2, by + TILE - 8);
  }
}

function drawCoin(wx, wy) {
  const sx = wx - camera.x;
  if (sx + 16 < 0 || sx > W) return;
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(sx + 8, wy + 8, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.arc(sx + 8, wy + 8, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawGoal(g) {
  const sx = g.x - camera.x;
  if (sx < -60 || sx > W + 60) return;
  ctx.fillStyle = '#888';
  ctx.fillRect(sx + 10, g.y - 130, 5, 162);
  ctx.fillStyle = '#FF4444';
  ctx.beginPath();
  ctx.moveTo(sx + 15, g.y - 130);
  ctx.lineTo(sx + 50, g.y - 112);
  ctx.lineTo(sx + 15, g.y - 94);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#666';
  ctx.fillRect(sx + 2, g.y + TILE - 10, 26, 10);
}

// Draw crab (player) - pixel-exact replica of kani.png
// Grid: 8 cols × 7 rows, scale 5 → 40×35px
// Palette: 0=transparent  1=orange(#D4694A)  2=white
//
//  . O W . . W O .   ← nubs: orange with white eye on inner side
//  . O O . . O O .
//  O O O O O O O O   ← body
//  O O O O O O O O
//  O O O O O O O O
//  O O . . . . O O   ← feet at bottom-left / bottom-right
//  O O . . . . O O
function drawCrab(cx, cy, dir, state, frame) {
  ctx.save();
  ctx.translate(cx, cy);
  if (dir < 0) ctx.scale(-1, 1);

  const lp = (state === 'walk' || state === 'dash') ? frame % 2 : 0;
  const OO = '#D4694A';
  const WW = '#FFFFFF';
  // Sprite 44w×36h centered at (0,0), scaled from kani.png pixel data
  const ox = -22, oy = -18;
  function r(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(ox + x, oy + y, w, h); }

  r(4,  0,  36, 9, OO);  // top section (narrow — head/shell top)
  r(0,  9,  44, 9, OO);  // body (wide — carapace with eye stalks)
  r(8,  9,  4,  6, WW);  // left eye (white)
  r(32, 9,  4,  6, WW);  // right eye (white)
  r(4,  18, 36, 9, OO);  // lower body (narrow)

  // Legs: 4 segments, alternating height for walk animation
  const d1 = lp ? 2 : 0;
  const d2 = lp ? 0 : 2;
  r(4,  27 + d1, 4, 9, OO); // left outer leg
  r(11, 27 + d2, 5, 9, OO); // left inner leg
  r(27, 27 + d2, 5, 9, OO); // right inner leg
  r(35, 27 + d1, 4, 9, OO); // right outer leg

  if (state === 'dash') {
    ctx.fillStyle = 'rgba(255,180,0,0.25)';
    ctx.fillRect(ox, oy, 44, 36);
  }

  ctx.restore();
}

// Draw walker enemy
function drawWalker(sx, sy, frame) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.fillStyle = '#8B0000';
  ctx.beginPath();
  ctx.ellipse(0, -2, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FF6666';
  ctx.beginPath();
  ctx.arc(-4, -5, 3, 0, Math.PI * 2);
  ctx.arc(4, -5, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5, 1, 3, 0, Math.PI * 2);
  ctx.arc(5, 1, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-4, 1, 2, 0, Math.PI * 2);
  ctx.arc(6, 1, 2, 0, Math.PI * 2);
  ctx.fill();
  const f = frame % 2 === 0 ? 2 : -2;
  ctx.fillStyle = '#8B0000';
  ctx.fillRect(-11, 8, 8, 4 + f);
  ctx.fillRect(3, 8, 8, 4 - f);
  ctx.restore();
}

// Draw shell enemy
function drawShell(sx, sy, hp, frame) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.fillStyle = hp >= 2 ? '#2E8B57' : '#90EE90';
  ctx.beginPath();
  ctx.ellipse(0, 0, 13, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = hp >= 2 ? '#1A5C37' : '#3C8C3C';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -11); ctx.lineTo(0, 11);
  ctx.moveTo(-13, 0); ctx.lineTo(13, 0);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5, -2, 3, 0, Math.PI * 2);
  ctx.arc(5, -2, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-4, -2, 2, 0, Math.PI * 2);
  ctx.arc(6, -2, 2, 0, Math.PI * 2);
  ctx.fill();
  const f = frame % 2 === 0 ? 1 : -1;
  ctx.fillStyle = '#1A5C37';
  ctx.fillRect(-11, 10, 7, 4 + f);
  ctx.fillRect(4, 10, 7, 4 - f);
  ctx.restore();
}

// Draw spike enemy
function drawSpike(sx, sy, frame) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.ellipse(0, 2, 13, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#888';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 5 - 3, -7);
    ctx.lineTo(i * 5, -18);
    ctx.lineTo(i * 5 + 3, -7);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#F00';
  ctx.beginPath();
  ctx.arc(-4, 2, 3, 0, Math.PI * 2);
  ctx.arc(4, 2, 3, 0, Math.PI * 2);
  ctx.fill();
  const f = frame % 2 === 0 ? 1 : -1;
  ctx.fillStyle = '#444';
  ctx.fillRect(-11, 11, 7, 4 + f);
  ctx.fillRect(4, 11, 7, 4 - f);
  ctx.restore();
}

// ============================================================
// DQN INFERENCE  (mirrors env.py _get_obs + forward pass)
// ============================================================

// Ground segments — mirrors game.html ground (= env.py _GROUND after fix)
const _RL_GROUND = [[0,1280],[1344,2240],[2336,3840],[3968,5760]];
const _RL_TILE   = 32;
const _RL_GOAL_X = 3700;
const _RL_WALK   = 3.5;
const _RL_JUMP   = -11;
const _RL_MAXVY  = 15;

function _rlGroundAt(x) {
  for (const [lo, hi] of _RL_GROUND) {
    if (x >= lo && x < hi) return 1.0;
  }
  return 0.0;
}

function _rlEnemyIn(xs, xe) {
  for (const e of stage.enemies) {
    if (e.alive && e.x >= xs && e.x < xe) return 1.0;
  }
  return 0.0;
}

function rlGetObs() {
  const p = player;
  const W = stage.width;  // 4000
  const obs = new Array(24);
  obs[0]  = p.x / W;
  obs[1]  = Math.min(1.0, Math.max(0.0, p.y / H));
  obs[2]  = Math.min(1.0, Math.max(0.0, (p.vx + _RL_WALK) / (2 * _RL_WALK)));
  obs[3]  = Math.min(1.0, Math.max(0.0, (p.vy - _RL_JUMP) / (_RL_MAXVY - _RL_JUMP)));
  obs[4]  = p.onGround ? 1.0 : 0.0;
  for (let i = 0; i < 10; i++)
    obs[5 + i]  = _rlGroundAt(p.x + (i + 1) * _RL_TILE);
  for (let i = 0; i < 8; i++)
    obs[15 + i] = _rlEnemyIn(p.x + (i + 1) * _RL_TILE, p.x + (i + 2) * _RL_TILE);
  obs[23] = Math.max(0.0, _RL_GOAL_X - p.x) / W;
  return obs;
}

function _rlLinear(x, W, b) {
  // output[i] = bias[i] + dot(W[i], x)
  return b.map((bi, i) => bi + W[i].reduce((s, wij, j) => s + wij * x[j], 0));
}

function rlForward() {
  let x = rlGetObs();
  const ls = rlModel.layers;
  x = _rlLinear(x, ls[0].weight, ls[0].bias).map(v => Math.max(0, v));
  x = _rlLinear(x, ls[1].weight, ls[1].bias).map(v => Math.max(0, v));
  x = _rlLinear(x, ls[2].weight, ls[2].bias).map(v => Math.max(0, v));
  x = _rlLinear(x, ls[3].weight, ls[3].bias);
  // argmax → 0=right, 1=right+jump, 2=jump, 3=left
  return x.indexOf(Math.max(...x));
}

// ============================================================
// AI PLAYER
// ============================================================
function groundExistsAt(wx) {
  for (const seg of stage.ground) {
    if (wx >= seg.x && wx < seg.x + seg.w) return true;
  }
  return false;
}

function computeAIInput() {
  if (!aiMode) return;

  // 自動リトライ（60フレーム≒1秒後）
  if (gameState === 'start' || gameState === 'gameover' || gameState === 'clear') {
    aiAutoStartTimer++;
    if (aiAutoStartTimer > 60) {
      aiAutoStartTimer = 0;
      rlSkipCount  = 0;
      rlLastAction = 0;
      initAudio();
      initGame();
      gameState = 'play';
      startBGM();
    }
    return;
  }
  aiAutoStartTimer = 0;

  if (gameState !== 'play' || !player || player.dead) return;

  // ── DQN モード（frame_skip=4 を再現）────────────────────────────────────
  if (rlModel) {
    if (rlSkipCount === 0) {
      rlLastAction = rlForward();   // 4フレームに1回だけ判断
    }
    rlSkipCount = (rlSkipCount + 1) % 4;
    const action = rlLastAction;
    keys['ArrowRight'] = (action === 0 || action === 1);
    keys['ArrowLeft']  = (action === 3);
    keys['Space']      = (action === 1 || action === 2);
    return;
  }

  // ── ルールベース フォールバック ───────────────────────────────────────────
  const p = player;
  if (aiJumpCooldown > 0) aiJumpCooldown--;

  keys['ArrowRight'] = true;
  keys['ArrowLeft']  = false;
  keys['Space']      = false;

  let wantJump = false;

  // 穴の検出：50〜220px先に地面がなければジャンプ
  if (p.onGround) {
    for (let dx = 50; dx <= 220; dx += 16) {
      if (!groundExistsAt(p.x + p.w + dx)) { wantJump = true; break; }
    }
  }

  // 敵の検出
  for (const e of stage.enemies) {
    if (!e.alive) continue;
    const dist = e.x - (p.x + p.w);
    if (dist < 0 || dist > 240) continue;
    if (e.type === 'spike') {
      if (dist < 190) wantJump = true;
    } else {
      if (dist < 110) wantJump = true;
    }
  }

  if (wantJump && p.onGround && aiJumpCooldown === 0) {
    keys['Space'] = true;
    aiJumpCooldown = 30;
  }
}

// ============================================================
// UPDATE
// ============================================================
const GRAVITY    = 0.5;
const JUMP_VY    = -11;
const WALK_SPEED = 3.5;
const DASH_SPEED = 6.5;

function update() {
  if (gameState !== 'play') return;
  globalFrame++;
  animTimer++;

  const p = player;
  if (p.dead) return;

  computeAIInput();

  const left  = keys['ArrowLeft']  || keys['KeyA'];
  const right  = keys['ArrowRight'] || keys['KeyD'];
  const jump  = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  const dash  = keys['ShiftLeft'] || keys['ShiftRight'];
  const spd   = dash ? DASH_SPEED : WALK_SPEED;

  if (left)       { p.vx = -spd; p.dir = -1; }
  else if (right) { p.vx =  spd; p.dir =  1; }
  else            { p.vx *= 0.75; }

  if (jump && p.onGround) {
    p.vy = JUMP_VY;
    p.onGround = false;
    playSFX('jump');
  }

  p.vy = Math.min(p.vy + GRAVITY, 15);
  p.x += p.vx;
  p.y += p.vy;

  p.x = Math.max(0, Math.min(p.x, stage.width - p.w));

  resolveSolidCollision(p, p.w, p.h);
  resolveBlockCollision(p);

  // Animation state
  if (!p.onGround)                    p.state = 'jump';
  else if (dash && (left || right))   p.state = 'dash';
  else if (left || right)             p.state = 'walk';
  else                                p.state = 'idle';

  if (animTimer >= 8) { p.animFrame++; animTimer = 0; }

  // Camera
  camera.x = Math.max(0, Math.min(p.x - W / 2 + p.w / 2, stage.width - W));

  // Fall into hole
  if (p.y > H + 80) { triggerGameOver(); return; }

  // Coins
  for (const c of stage.coins) {
    if (c.collected) continue;
    if (overlap(p.x, p.y, p.w, p.h, c.x, c.y, 16, 16)) {
      c.collected = true;
      coinCount++;
      score += 50;
      playSFX('coin');
      spawnParticles(c.x + 8, c.y + 8, '#FFD700', 6);
    }
  }

  // Enemies
  const ef = Math.floor(globalFrame / 10) % 2;
  for (const e of stage.enemies) {
    if (!e.alive) continue;
    e.vy = Math.min(e.vy + GRAVITY, 15);
    e.x += e.vx;
    e.y += e.vy;
    e.onGround = false;
    resolveSolidCollision(e, 24, 28);
    resolveEnemyBlockCollision(e);

    if (e.y > H + 80) { e.alive = false; continue; }

    if (!overlap(p.x, p.y, p.w, p.h, e.x, e.y, 24, 28)) continue;

    const stomp = p.vy > 0 && (p.y + p.h) < (e.y + 14);
    if (stomp) {
      if (e.type === 'spike') { triggerGameOver(); return; }
      e.hp--;
      p.vy = -7;
      playSFX('stomp');
      score += 200;
      const col = e.type === 'shell' ? '#2E8B57' : '#8B0000';
      spawnParticles(e.x + 12, e.y, col, 8);
      if (e.hp <= 0) e.alive = false;
    } else {
      triggerGameOver(); return;
    }
  }

  // Block bounce timers
  for (const b of stage.blocks) {
    if (b.bounceTimer > 0) b.bounceTimer--;
  }

  // Goal
  const g = stage.goal;
  if (overlap(p.x, p.y, p.w, p.h, g.x, g.y, 40, 160)) {
    gameState = 'clear';
    stopBGM();
    playSFX('clear');
    score += 1000;
  }

  // Particles
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);

  // Floating coins
  for (const fc of floatingCoins) { fc.y += fc.vy; fc.vy += 0.3; fc.alpha -= 0.03; }
  floatingCoins = floatingCoins.filter(fc => fc.alpha > 0);
}

function triggerGameOver() {
  player.dead = true;
  gameState = 'gameover';
  stopBGM();
  playSFX('gameover');
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'start') { drawStartScreen(); return; }

  drawBackground();

  for (const p of stage.ground)    drawPlatform(p);
  for (const p of stage.platforms) drawPlatform(p);
  for (const b of stage.blocks)    drawBlock(b);

  for (const c of stage.coins)     if (!c.collected) drawCoin(c.x, c.y);

  // Floating coins from blocks
  for (const fc of floatingCoins) {
    ctx.save();
    ctx.globalAlpha = fc.alpha;
    drawCoin(fc.x + camera.x, fc.y); // fc.x is already screen-space relative
    ctx.restore();
  }

  drawGoal(stage.goal);

  // Enemies
  const ef = Math.floor(globalFrame / 10) % 2;
  for (const e of stage.enemies) {
    if (!e.alive) continue;
    const sx = e.x - camera.x + 12;
    const sy = e.y + 14;
    if (sx < -60 || sx > W + 60) continue;
    if (e.type === 'walker') drawWalker(sx, sy, ef);
    else if (e.type === 'shell') drawShell(sx, sy, e.hp, ef);
    else drawSpike(sx, sy, ef);
  }

  // Player
  if (!player.dead) {
    drawCrab(
      player.x - camera.x + player.w / 2,
      player.y + player.h / 2,
      player.dir, player.state, player.animFrame
    );
  }

  // Particles
  for (const pt of particles) {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.life / 50;
    ctx.fillRect(pt.x - camera.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  drawHUD();
  if (gameState === 'gameover') drawGameOverScreen();
  if (gameState === 'clear')    drawClearScreen();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, 34);
  ctx.font = 'bold 15px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText(`SCORE: ${score}`, 14, 23);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(`COINS: ${coinCount}`, W / 2, 23);
  ctx.textAlign = 'right';
  if (aiMode) {
    ctx.fillStyle = '#00FF88';
    const label = rlModel ? '** DQN AI **  [F:OFF]' : '** RULE AI **  [F:OFF]';
    ctx.fillText(label, W - 14, 23);
  } else {
    ctx.fillStyle = '#aaa';
    const hint = rlModel ? '[F] DQN AI' : '[F] RULE AI';
    ctx.fillText(hint, W - 14, 23);
  }
}

function drawStartScreen() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 80; i++) ctx.fillRect((i * 97 + 13) % W, (i * 137 + 7) % (H - 20), 2, 2);

  ctx.fillStyle = '#E8541A';
  ctx.font = 'bold 52px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('CRAB', W / 2, 130);
  ctx.fillStyle = '#FFD700';
  ctx.fillText('ADVENTURE', W / 2, 190);

  drawCrab(W / 2, 255, 1, 'idle', 0);

  ctx.fillStyle = Math.floor(Date.now() / 500) % 2 === 0 ? '#fff' : '#aaa';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('PRESS  SPACE  TO  START', W / 2, 320);

  ctx.fillStyle = '#888';
  ctx.font = '13px monospace';
  ctx.fillText('←→/AD:Move   Space/↑:Jump   Shift:Dash   F:AI Mode', W / 2, 360);
  if (aiMode) {
    ctx.fillStyle = '#00FF88';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('AI MODE ON - auto start in ' + Math.ceil((61 - aiAutoStartTimer) / 60) + 's', W / 2, 385);
  }
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.68)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#FF4444';
  ctx.font = 'bold 50px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W / 2, 165);
  ctx.fillStyle = '#fff';
  ctx.font = '22px monospace';
  ctx.fillText(`SCORE: ${score}`, W / 2, 220);
  ctx.fillStyle = Math.floor(Date.now() / 500) % 2 === 0 ? '#fff' : '#999';
  ctx.font = '18px monospace';
  ctx.fillText('PRESS  SPACE  TO  RETRY', W / 2, 285);
}

function drawClearScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 46px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('STAGE CLEAR!', W / 2, 155);
  ctx.fillStyle = '#fff';
  ctx.font = '22px monospace';
  ctx.fillText(`SCORE: ${score}`, W / 2, 215);
  ctx.fillText(`COINS: ${coinCount}`, W / 2, 250);
  ctx.fillStyle = Math.floor(Date.now() / 500) % 2 === 0 ? '#fff' : '#999';
  ctx.font = '18px monospace';
  ctx.fillText('PRESS  SPACE  TO  PLAY AGAIN', W / 2, 315);
}

// ============================================================
// GAME LOOP
// ============================================================
document.addEventListener('keydown', e => {
  // F キー: AIモード切り替え
  if (e.code === 'KeyF') {
    aiMode = !aiMode;
    aiJumpCooldown = 0;
    aiAutoStartTimer = 0;
    if (!aiMode) {
      // 手動に戻したとき AI が押しっぱなしにしていたキーをリセット
      keys['ArrowRight'] = false;
      keys['Space']      = false;
    }
    initAudio();
    return;
  }
  if (e.code !== 'Space') return;
  initAudio();
  if (gameState === 'start') {
    initGame(); gameState = 'play'; startBGM();
  } else if (gameState === 'gameover' || gameState === 'clear') {
    initGame(); gameState = 'play'; startBGM();
  }
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
